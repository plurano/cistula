---
# Release builder: builds the release files with the gate's own targets,
# writes their checksums and parts lists and, when `sign` is true, signs the
# checksums and attests their provenance. It is called by release.yml and by
# nothing else, so the identity in the signature and in the attestation is
# this file, which only builds. It restores no cache and downloads no earlier
# build: every file it attests was built in this job
# (docs/adr/0001-release-job.md).
name: Release build

on:
  workflow_call:
    inputs:
      sign:
        description: Whether to sign and attest the release files
        type: boolean
        required: true

permissions:
  contents: read

env:
  REUSE_VERSION: "6.2.0"

jobs:
  build:
    name: Build, sign and attest the release files
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The action puts the directory of every listed version on PATH, so the
      # names the Makefile looks up (python3.11 to python3.14) all
      # resolve to the versions installed here.
      - name: Install the supported interpreters
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: |
            3.11
            3.12
            3.13
            3.14

      # The version names every file below. A tag must be `v` plus that
      # version and point at a commit of `main`; the full-history checkout
      # above holds `origin/main`.
      - name: Read the version and check the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          version="$(python3 -I -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "$IS_TAG" = true ]; then
            if [ "$TAG" != "v${version}" ]; then
              echo "::error::tag $TAG is not v${version}, the version in pyproject.toml"
              exit 1
            fi
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::tag $TAG points at $GITHUB_SHA, which is not on main"
              exit 1
            fi
          fi

      - name: Build and verify the library
        run: make verify REUSE="pipx run reuse==${REUSE_VERSION}"

      - name: Write the checksums
        working-directory: dist
        run: |
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          cat SHA256SUMS
          {
            echo "### SHA256SUMS"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1

      # The inventory reads the unpacked wheel, the file a consumer installs:
      # its metadata and file records, not the whole checkout with the
      # gate's tools. Unpacked outside dist/, so nothing extra is shipped.
      - name: Write the dependency inventory
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 -I -m zipfile -e "dist/cistula-${VERSION}-py3-none-any.whl" "$RUNNER_TEMP/wheel"
          syft scan "dir:$RUNNER_TEMP/wheel" \
            -o "cyclonedx-json=dist/cistula-${VERSION}.cyclonedx.json" \
            -o "spdx-json=dist/cistula-${VERSION}.spdx.json"

      - name: Install Cosign
        if: inputs.sign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign the checksums
        if: inputs.sign
        run: |
          cosign sign-blob --yes \
            --bundle dist/SHA256SUMS.sigstore.json \
            dist/SHA256SUMS

      - name: Attest the provenance of every checksummed file
        if: inputs.sign
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      # A dry run on main signs nothing: while the repository is private the
      # forge offers no attestation and a keyless signature would write the
      # repository into a public log. The gap shows in every such run.
      - name: Say that the files are not signed
        if: ${{ !inputs.sign }}
        run: echo "::notice::dry run - the files are not signed and not attested; only a tag run signs and attests them"

      - name: Hand the release files to the calling workflow
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 7
