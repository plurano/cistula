---
# Verification gate: runs `make verify-all`, the same target a contributor
# runs locally. One job installs every supported interpreter, because the gate
# builds one wheel and tests that same wheel on each of them; a job per
# interpreter would build and test three different files. Linux only, which
# is why the README and the package metadata claim Linux and no other system;
# the library refuses to run where process groups are missing.
#
# The gate ends with the standards engine (agent contexts, text register,
# audit). The engine is built here from one pinned commit of its public
# repository; no released binary and no moving branch is trusted.
name: Verification gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # A merge queue reports the required check on the merge group's commit.
  merge_group:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  REUSE_VERSION: "6.2.0"
  # Published Praetor commit that builds the praetorctl this gate pins. The
  # name is the one the engine's hook launcher reads
  # (.config/lefthook/engine.sh), so the local hooks and `make verify-all`
  # run this same commit and not whatever praetorctl is on PATH.
  PRAETOR_REF: "c444d87e6e6e1c88bfdcb32b56f20123585447bb"

jobs:
  verify:
    name: Verification gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # Full history: the sign-off step reads every commit of the pull request.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Secret scan of every commit (HISS-12; the security:high facet declares
      # gitleaks). The binary is the release file pinned by version and
      # checksum. A repository holding one token generated here must make
      # gitleaks exit 1 first, so a scanner that finds nothing, or fails to
      # start, cannot pass the gate.
      - name: Secret scan of the whole history
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          dir="$RUNNER_TEMP/gitleaks"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$dir"
          curl -fsSL --max-time 120 -o "$dir/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $dir/$archive" | sha256sum -c -
          tar -xzf "$dir/$archive" -C "$dir" gitleaks
          planted="$RUNNER_TEMP/planted-secret"
          git init -q "$planted"
          printf 'token = "ghp_%s"\n' "$(openssl rand -hex 18)" > "$planted/planted.txt"
          git -C "$planted" add planted.txt
          git -C "$planted" -c user.name=planted -c user.email=planted@invalid \
            -c commit.gpgsign=false commit -q -m planted
          status=0
          "$dir/gitleaks" git --redact --no-banner --exit-code 1 "$planted" || status=$?
          if [ "$status" -ne 1 ]; then
            echo "::error::gitleaks exited $status on a planted token instead of 1"
            exit 1
          fi
          "$dir/gitleaks" git --redact --no-banner --exit-code 1 .

      # The action puts the directory of every listed version on PATH, so the
      # names the Makefile looks up (python3.11 to python3.14) all
      # resolve to the versions installed here.
      - name: Install the supported interpreters
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: |
            3.11
            3.12
            3.13
            3.14

      - name: Check out pinned Praetor source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cordanaLLM/praetor
          ref: ${{ env.PRAETOR_REF }}
          path: praetor-src
          persist-credentials: false

      - name: Set up the Go toolchain declared by Praetor
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: praetor-src/go.mod
          cache: false

      - name: Build pinned praetorctl from the published Praetor commit
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: "0"
          GOFLAGS: -mod=readonly
        run: |
          test "$(git -C praetor-src rev-parse HEAD)" = "$PRAETOR_REF"
          mkdir -p "$RUNNER_TEMP/bin"
          # go vet first: the Go compiler has no warnings, so vet is the
          # warnings-as-errors form for the one Go build this gate runs.
          ( cd praetor-src && go mod download && go mod verify \
            && go vet ./... \
            && go build -trimpath -buildvcs=false \
              -o "$RUNNER_TEMP/bin/praetorctl" ./cmd/standardsctl )
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          # The Praetor checkout is a build input only; the audit and the
          # licence check must not read it as content of this repository.
          rm -rf praetor-src

      # PRAETORCTL names the binary built above. Without it the Makefile
      # asks the hook launcher, which would install the pinned commit a
      # second time through the Go module proxy.
      - name: Verification gate
        run: >-
          make verify-all
          REUSE="pipx run reuse==${REUSE_VERSION}"
          PRAETORCTL="$RUNNER_TEMP/bin/praetorctl"

      - name: Sign-off on pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            if ! git log -1 --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "::error::commit $sha lacks a Signed-off-by trailer"
              missing=1
            fi
          done
          exit "$missing"
