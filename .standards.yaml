---
version: 1
repository:
  owner: plurano
  name: cistula
  visibility: private
  description: Shared Python helpers of the Plurano framework family
  homepage: ""
  topics: []
profiles:
  - framework
facets:
  - security:high
  - api:public-contract
  - agent:sandboxed
# Stand-in: the engine has no flavor for a Python library yet
# (cordanaLLM/praetor#67). python-ml is the nearest one; re-adopt when the
# library flavor lands.
flavors:
  - name: python-ml
# Installed set: Claude Code, Codex, Gemini and Antigravity, opencode.
# opencode reads AGENTS.md and has no id.
# Editors: the engine's own selection plus antigravity; it has no file of its own here.
editors:
  - universal
  - vscode
  - antigravity
agent_clients:
  - claude
  - codex
  - gemini
# One maintainer: the engine renders zero approvals, no code-owner review and
# the repository admin role as pull-request bypass actor. Restore independent
# review when a second maintainer or a review bot can approve.
overrides:
  branch_protection:
    review_mode: single_maintainer
register:
  sources:
    expected: 13
    sha256:
      sha256:21731aeac3c2442a4eb28abd0593ab59cb453db34c8937c0b268c70d219141aa
    inputs:
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: operating_contract.*
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: invariants.*
exceptions:
  - rule: declared-linters
    tool: semgrep
    reason: the only Python rule of the pinned engine's semgrep set (hiss-08 eval/exec in .config/semgrep/hiss-invariants.yml) is what the praetorctl audit HISS-08 scan in make verify-all already refuses; a semgrep job needs semgrep in the hash-locked requirements/dev.txt first
    expires: "2027-01-11"
  - rule: declared-linters
    tool: trivy
    reason: the package has no runtime dependency to scan and its build and test tools come hash-locked from requirements/dev.txt under the update bot; a trivy filesystem job over requirements/dev.txt and the dev container image is due before this entry expires
    expires: "2027-01-11"
