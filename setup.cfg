# The wheel stores its members without compressing them. Two compression
# libraries give different bytes for the same input, and the hash of the wheel
# must not depend on the library an interpreter was built with. The setting is
# here and not in pyproject.toml because the build backend still warns that
# its `[tool.distutils]` table there may change.
[bdist_wheel]
compression = stored
