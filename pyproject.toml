# The build backend is not resolved from here at build time: the gate builds
# without isolation inside the environment that requirements/dev.txt pins by
# hash, so the setuptools that runs is the locked one.
[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

# Cistula (KIS-tu-la): Latin for a small chest of tools. Repository,
# distribution and import name are all "cistula".
[project]
name = "cistula"
version = "0.1.0.dev0"
description = "Shared Python helpers of the Plurano framework family."
readme = "README.md"
requires-python = ">=3.11"
license = "EUPL-1.2"
license-files = ["LICENSE"]
authors = [{ name = "Lusoris", email = "lusoris@proton.me" }]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["cistula"]
include-package-data = false

[tool.setuptools.package-data]
cistula = ["py.typed"]

# The lint and format configuration is in ruff.toml.

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "tools"]
# Not enabled: warn_unreachable and redundant-expr. The public functions refuse
# arguments of the wrong type at run time, for callers that run no type
# checker; to a type checker those refusals are unreachable by construction.
enable_error_code = ["ignore-without-code", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source_pkgs = ["cistula"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
