<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="Cistula: shared Python helpers of the Plurano framework family">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#111a35"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="120" rx="12" fill="url(#bg)"/>

  <!-- bounded execution, atomic file staging, streaming cryptographic digests -->
  <g fill="none" stroke-linecap="round">
    <path d="M680 72 C 760 38, 830 92, 910 64 S 1030 40, 1140 68"
          stroke="url(#wave)" stroke-width="14"/>
    <path d="M680 72 C 760 38, 830 92, 910 64 S 1030 40, 1140 68"
          stroke="url(#accent)" stroke-width="2.5" opacity="0.95"/>
    <path d="M680 78 C 760 44, 830 98, 910 70 S 1030 46, 1140 74"
          stroke="#06b6d4" stroke-width="1.6" stroke-dasharray="6 8" opacity="0.65"/>
    <path d="M680 66 C 760 32, 830 86, 910 58 S 1030 34, 1140 62"
          stroke="#8b5cf6" stroke-width="1.4" opacity="0.5"/>
  </g>

  <text x="44" y="74" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="64" font-weight="700" fill="#e2e8f0" letter-spacing="-1">Cistula</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#94a3b8">
    <text x="310" y="52">process · files · digest</text>
    <text x="310" y="76">atomic · durable · bounded · strict</text>
  </g>
</svg>
